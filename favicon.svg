  <title id="title">Phototold</title>
  <desc>The Phototold mark on a 24-unit grid, y growing downward: a family snapshot and a record button on a violet tile with corners of radius 5.4. The print (11.3 11 15.6 15.6 -7: centre x, centre y, width, height, tilt in degrees, clockwise positive) has a deckle edge (14 0.15: scallops per side, their depth) and a paper border (1.45 0.3: border width, the picture window's corner radius); in the window a sepia sky over the ground (the horizon at 0.68 of the window's height) and two figures standing on it with their feet at 0.88 of the window's height, a grown-up (0.38 0.33 1.12 2.9) and a child (0.63 0.49 0.86 2.2): head centre x and y as fractions of the window, head radius, body width. The record button (18.1 18.1 3.95 0.95: centre x, centre y, outer radius, the white rim's width) sits over the print's lower right corner. Written by assets/generate-assets.py --write-logo from the data- numbers on the grid element; never edited by hand.</desc>
